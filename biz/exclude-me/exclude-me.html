<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclude Analytics</title>
</head>
<body>
  <script>
    document.cookie = "cf_no_analytics=true; path=/; max-age=31536000; secure; samesite=lax";
    document.body.innerHTML = `
      <div style="font-family: sans-serif; padding: 40px; line-height: 1.8;">
        <h1>除外設定をONにしました。</h1>
        <p>このブラウザでは、Cloudflare Web Analytics の計測除外用 cookie を設定しました。</p>
        <p>1年後に自動失効します。cookie を削除すると解除されます。</p>
        <p><a href="/">トップページに戻る</a></p>
      </div>
    `;
  </script>
</body>
</html>
