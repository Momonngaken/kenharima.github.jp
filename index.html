<!DOCTYPE html>
<html lang="ja" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Harima | Moved</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: 高級感のあるセリフ体と、清潔なサンセリフ体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        'sand': '#F9F9F7', // 紙のような優しい白
                        'ink': '#1A1A1A',   // 真っ黒ではない、墨のような黒
                        'gold': '#C5A059'   // 控えめなアクセント
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F9F9F7;
            color: #1A1A1A;
            overflow: hidden; /* スクロールなし */
        }

        /* 優雅なラインアニメーション */
        .line-link {
            position: relative;
            text-decoration: none;
            display: inline-block;
        }
        .line-link::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: #1A1A1A;
            transform: scaleX(0);
            transform-origin: bottom right;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .line-link:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* 背景の幾何学模様（ゆっくり動く） */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen w-screen px-6">

    <!-- 背景装飾: 怖くない、優しい光のようなグラデーション -->
    <div class="bg-shape w-96 h-96 bg-gray-200 top-[-10%] left-[-10%]"></div>
    <div class="bg-shape w-[30rem] h-[30rem] bg-gray-100 bottom-[-10%] right-[-10%] animation-delay-2000"></div>

    <!-- コンテンツコンテナ -->
    <main class="relative z-10 max-w-2xl w-full flex flex-col items-center text-center">
        
        <!-- 1. 小さな署名 -->
        <div class="reveal-item mb-12 opacity-0">
            <span class="font-sans text-xs tracking-[0.2em] text-gray-400 uppercase">Ken Harima — Portfolio</span>
        </div>

        <!-- 2. メインメッセージ -->
        <!-- シンプルに「移動しました」とだけ伝える -->
        <h1 class="reveal-item text-5xl md:text-7xl font-serif mb-8 opacity-0 leading-tight">
            <span class="block italic text-gray-400 font-normal text-3xl md:text-4xl mb-2">This chapter has</span>
            Concluded.
        </h1>

        <!-- 3. 説明文 -->
        <p class="reveal-item font-sans text-sm md:text-base text-gray-500 leading-relaxed max-w-md mb-16 opacity-0">
            本プライベートポートフォリオの公開は終了いたしました。<br class="hidden md:block">
            現在はビジネス向けの活動に拠点を移行しています。
        </p>

        <!-- 4. 新しいサイトへの誘導ボタン -->
        <!-- 押し付けがましくない、美しいリンク -->
        <div class="reveal-item opacity-0">
            <a href="./biz/index.html" class="group flex items-center gap-4 text-ink transition-colors duration-500">
                <div class="relative w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center group-hover:border-ink transition-colors duration-500 bg-white shadow-sm group-hover:shadow-md">
                    <svg class="w-4 h-4 transform -rotate-45 group-hover:rotate-0 transition-transform duration-500 ease-out" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </div>
                <div class="text-left">
                    <span class="block font-serif text-lg italic text-gray-400 group-hover:text-ink transition-colors duration-300">Visit new site</span>
                    <span class="line-link font-sans text-xs font-bold tracking-widest uppercase">Business Portfolio</span>
                </div>
            </a>
        </div>

    </main>

    <!-- フッター: 極限までシンプルに -->
    <footer class="fixed bottom-8 w-full text-center z-10 reveal-item opacity-0">
        <p class="font-sans text-[10px] text-gray-300 tracking-widest">© 2026 KEN HARIMA</p>
    </footer>

    <script>
        // ページ読み込み時に、要素が下から順番にフワッと現れる演出
        // これにより「静寂」と「品格」を表現します
        window.addEventListener('load', () => {
            const tl = gsap.timeline();

            tl.to(".reveal-item", {
                y: 0,
                opacity: 1,
                duration: 1.2,
                stagger: 0.15, // 0.15秒ずつずらして表示
                ease: "power3.out", // 自然な減速
                from: { y: 20 } // 20px下から出現
            });
        });

        // マウスの動きに合わせて、文字がわずかに動く（視差効果）
        // 怖くない程度に、画面に「空気感」を持たせる
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;

            gsap.to('h1', {
                x: x,
                y: y,
                duration: 1.5,
                ease: "power2.out"
