<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecting | Ken HARIMA</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://kenharima.com/biz/">
    
    <!-- JSが無効な環境向けの即時リダイレクト -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://kenharima.com/biz/">
    </noscript>

    <style>
        /* =========================================================
           APPLE-LIKE MINIMALISM & THE HALO RING REVEAL
           ========================================================= */
        :root {
            --bg-base: #fafafa;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, filter;
        }

        /* 画面全体に微かなホワイトグラデーション */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,1) 0%, var(--bg-base) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* メインページと世界観を同期させるアンビエントな光 */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(15,60,133,0.05) 0%, rgba(34,211,238,0.04) 40%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        /* コンテンツ配置 */
        .redirect-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ▼▼▼ The Halo Ring (多層光学スキャン・リング) ▼▼▼ */
        .ring-loader {
            position: relative;
            width: 56px;
            height: 56px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. 外側の極細トラックリング（ゆっくり逆回転） */
        .ring-outer {
            position: absolute;
            inset: 0;
            border: 1px dashed rgba(134, 134, 139, 0.3);
            border-radius: 50%;
            animation: spinReverse 12s linear infinite;
        }

        /* 2. メインの流麗なSVGストロークリング（伸び縮みしながら回転） */
        .ring-inner {
            width: 44px;
            height: 44px;
            animation: spin 2s linear infinite;
            filter: drop-shadow(0 0 6px rgba(0, 208, 197, 0.3)); /* 魔法のようなシアンの発光 */
        }

        .ring-track {
            stroke: rgba(134, 134, 139, 0.08);
        }

        .ring-path {
            stroke: url(#ring-gradient);
            stroke-linecap: round;
            stroke-dasharray: 1, 150;
            stroke-dashoffset: 0;
            animation: dashRing 1.5s ease-in-out infinite;
        }

        /* 3. 中央の脈打つコア（知性の表現） */
        .ring-core {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: #00D0C5;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(0, 208, 197, 0.6);
            animation: pulseCore 2s ease-in-out infinite;
        }
        /* ▲▲▲ The Halo Ring ここまで ▲▲▲ */

        /* ----- 光の中からの実体化エフェクト ----- */
        .optic-reveal {
            opacity: 0;
            filter: blur(12px) brightness(1.2);
            transform: translateY(8px) scale(0.98);
            animation: opticFocusReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: opacity, transform, filter;
        }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.4s; }

        @keyframes opticFocusReveal {
            0% { opacity: 0; transform: translateY(8px) scale(0.98); filter: blur(12px) brightness(1.2); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px) brightness(1); }
        }

        /* リング用のアニメーションキーフレーム */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.5); } }
        @keyframes dashRing {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35px; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -138px; }
        }
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* タイポグラフィ設計 */
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        p {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.01em;
        }
        
        .brand-name {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(134, 134, 139, 0.5);
            margin-top: 56px;
        }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 最も美しいリングの軌跡を見せるための待機時間 (1.6秒)
            setTimeout(function() {
                // 画面を光の中に溶かすようにフェードアウト
                document.body.style.opacity = '0';
                document.body.style.filter = 'blur(8px) brightness(1.1)';
                
                // フェードアウト完了直後にメインページへ遷移
                setTimeout(function() {
                    window.location.replace("https://kenharima.com/biz/");
                }, 600); // transition時間と同期
            }, 1600); 
        });
    </script>
</head>
<body>
    <!-- アンビエントな光のエフェクト -->
    <div class="ambient-glow"></div>
    
    <div class="redirect-container">
        
        <!-- ▼▼▼ The Halo Ring (多層光学スキャン) ▼▼▼ -->
        <div class="ring-loader optic-reveal">
            <div class="ring-outer"></div>
            <svg class="ring-inner" viewBox="0 0 50 50">
                <defs>
                    <!-- メインページの世界観に直結するシアン〜ディープブルーのグラデーション -->
                    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#0f3c85" />
                        <stop offset="100%" stop-color="#00D0C5" />
                    </linearGradient>
                </defs>
                <!-- トラック（軌道） -->
                <circle class="ring-track" cx="25" cy="25" r="22" fill="none" stroke-width="1.5"></circle>
                <!-- 実際に伸び縮みするグラデーションリング -->
                <circle class="ring-path" cx="25" cy="25" r="22" fill="none" stroke-width="2.5"></circle>
            </svg>
            <div class="ring-core"></div>
        </div>
        <!-- ▲▲▲ The Halo Ring ここまで ▲▲▲ -->

        <!-- Appleらしいタイトで美しい見出し -->
        <h1 class="optic-reveal delay-1">Redirecting</h1>
        <p class="optic-reveal delay-2">Ken Harima Official</p>
        
        <!-- 下部のアイコニックなクレジット -->
        <div class="brand-name optic-reveal delay-3">Establishing Secure Connection...</div>
    </div>
</body>
</html>
