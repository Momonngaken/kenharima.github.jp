<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecting | Ken HARIMA</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://kenharima.com/biz/">
    
    <!-- JSが無効な環境向けのフォールバック（即時リダイレクト） -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://kenharima.com/biz/">
    </noscript>

    <style>
        /* =========================================================
           APPLE-LIKE MINIMALISM & OPTIC FOCUS REVEAL
           ========================================================= */
        :root {
            --bg-base: #fafafa;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            /* 極限のAppleシステムフォント統一 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* 次のページへの遷移をシームレスにするためのフェードアウト用 */
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, filter;
        }

        /* 画面全体に微かなホワイトグラデーション（メインページと共通） */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,1) 0%, var(--bg-base) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* メインページと世界観を同期させるアンビエントな光 */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(15,60,133,0.04) 0%, rgba(34,211,238,0.03) 40%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        /* コンテンツ配置 */
        .redirect-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Apple風の極細・高精度ローディングスピナー */
        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(134, 134, 139, 0.15);
            border-top-color: rgba(29, 29, 31, 0.8);
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin-bottom: 24px;
        }

        /* ----- メインページと同じ「光の中からの実体化」エフェクト ----- */
        .optic-reveal {
            opacity: 0;
            filter: blur(12px) brightness(1.2);
            transform: translateY(8px) scale(0.98);
            animation: opticFocusReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: opacity, transform, filter;
        }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.4s; }

        @keyframes opticFocusReveal {
            0% { opacity: 0; transform: translateY(8px) scale(0.98); filter: blur(12px) brightness(1.2); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px) brightness(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* タイポグラフィ設計 (カーニングとコントラストの最適化) */
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        p {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.01em;
        }
        
        .brand-name {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(134, 134, 139, 0.6);
            margin-top: 48px;
        }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. ユーザーに美しいUIを認識させるための僅かな待機時間 (1.4秒)
            setTimeout(function() {
                // 2. 画面を光の中に溶かすようにフェードアウト
                document.body.style.opacity = '0';
                document.body.style.filter = 'blur(8px) brightness(1.1)';
                
                // 3. フェードアウト完了直後にメインページへ遷移
                setTimeout(function() {
                    window.location.replace("https://kenharima.com/biz/");
                }, 600); // CSSのtransition(0.6s)と完全に同期させる
            }, 1400); 
        });
    </script>
</head>
<body>
    <!-- アンビエントな光のエフェクト -->
    <div class="ambient-glow"></div>
    
    <div class="redirect-container">
        <!-- iOS/Macライクなスピナー -->
        <div class="spinner optic-reveal"></div>
        
        <!-- Appleらしいタイトで美しい見出し -->
        <h1 class="optic-reveal delay-1">Redirecting</h1>
        <p class="optic-reveal delay-2">Ken HARIMA Business Portfolio</p>
        
        <!-- 下部のアイコニックなクレジット -->
        <div class="brand-name optic-reveal delay-3">Connecting...</div>
    </div>
</body>
</html>
